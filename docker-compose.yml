# Local development: docker compose up -d && docker compose run --rm setup
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tab
      POSTGRES_PASSWORD: tab
      POSTGRES_DB: tab_pms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tab -d tab_pms"]
      interval: 5s
      retries: 20

  setup:
    build: .
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tab:tab@db:5432/tab_pms?schema=public
    depends_on: { db: { condition: service_healthy } }
    profiles: ["setup"]

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tab:tab@db:5432/tab_pms?schema=public
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s

  worker:
    build: .
    command: ["npx", "tsx", "src/jobs/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tab:tab@db:5432/tab_pms?schema=public
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
